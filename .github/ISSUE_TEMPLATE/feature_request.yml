name: "Feature request"
description: "Suggest a new skill, platform adaptation, or improvement."
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea to improve AI Skills Bank!
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
      placeholder: The current skills or docs do not...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see added or changed?
      placeholder: Add a new skill/category/guide that...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you considered?
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Links, references, or examples.

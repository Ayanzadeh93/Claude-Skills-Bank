name: Validate skills

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/**"
      - "skills.json"
      - ".github/workflows/validate-skills.yml"
  pull_request:
    paths:
      - "skills/**"
      - "scripts/**"
      - "skills.json"
      - ".github/workflows/validate-skills.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Skill IDs and skills.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check format, uniqueness and completeness
        run: node scripts/build-skills-json.mjs --check

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" rx="16" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="50" cy="50" r="80" fill="rgba(255,255,255,0.05)"/>
  <circle cx="750" cy="150" r="120" fill="rgba(255,255,255,0.05)"/>
  <circle cx="400" cy="180" r="60" fill="rgba(255,255,255,0.03)"/>
  
  <!-- Brain emoji area -->
  <text x="400" y="65" text-anchor="middle" font-size="40" fill="white" filter="url(#glow)">🧠</text>
  
  <!-- Title -->
  <text x="400" y="115" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="800" fill="url(#text-gradient)" letter-spacing="2">
    AI Skills Bank
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="150" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="16" fill="rgba(255,255,255,0.85)" letter-spacing="1">
    500 Reusable Skills for AI Coding Agents
  </text>
  
  <!-- Platform icons row -->
  <text x="400" y="180" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="rgba(255,255,255,0.6)" letter-spacing="3">
    CLAUDE CODE  •  CODEX CLI  •  GEMINI CLI  •  KIMI CLI  •  AIDER  •  CLINE
  </text>
</svg>
